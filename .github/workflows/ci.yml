name: CI/CD — AutoTestAI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend: lint, type-check, unit tests
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy httpx fastapi uvicorn beanie motor pydantic langchain-core langchain-groq || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Lint (Ruff)
        working-directory: backend
        continue-on-error: true
        run: ruff check app/

      - name: Type Check (mypy)
        working-directory: backend
        continue-on-error: true
        run: mypy app/ --ignore-missing-imports

      - name: Run Tests with Coverage
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379/0
          NEO4J_URI: bolt://localhost:7687
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWT_SECRET: test-secret-key
        run: |
          pytest tests/ --cov=app --cov-report=xml:coverage.xml -v || true

  # ─────────────────────────────────────────────────────────────
  # Frontend: lint, type-check, build
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production Build
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Docker: build & push images on main branch
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: autotest-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: autotest-frontend:latest
