name: CI/CD — AutoTestAI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend: lint, type-check, unit tests
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        working-directory: backend
        run: ruff check app/
        continue-on-error: true

      - name: Type Check (mypy)
        working-directory: backend
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true

      - name: Run Tests with Coverage
        working-directory: backend
        env:
          APP_ENV: development
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DB_NAME: autotest
          REDIS_URL: redis://localhost:6379/0
          NEO4J_URI: bolt://localhost:7687
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test-mock-groq-key' }}
          JWT_SECRET: test-secret-key-for-ci
          AUTOTEST_USE_DOCKER: false
          CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://192.168.56.1:3000
          CORS_ORIGIN_REGEX: .*
        run: |
          pytest tests/ --cov=app --cov-report=xml:coverage.xml -v

  # ─────────────────────────────────────────────────────────────
  # Frontend: lint, type-check, build
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Type Check
        working-directory: frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx tsc --noEmit

      - name: Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Docker: build & push images on main branch
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: autotest-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: autotest-frontend:latest
